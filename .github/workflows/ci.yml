name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Lint
        run: mise run lint
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Bundle
        run: |
          ./script/make-icon.sh --force
          ./script/bundle.sh --config release
